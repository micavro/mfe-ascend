start_ops: [draft]
end_ops: [final]
ops:
  draft:
    model: "${MFE_MODEL_PATH}"
    prompt: "Draft a complete solution."
    max_tokens: 1024
    input_ops: []
    output_ops: [critic_1]
  critic_1:
    model: "${MFE_MODEL_PATH}"
    prompt: "Critique the draft and identify concrete mistakes or missing steps."
    max_tokens: 1024
    input_ops: [draft]
    output_ops: [revise_1]
  revise_1:
    model: "${MFE_MODEL_PATH}"
    prompt: "Revise the solution using the critique."
    max_tokens: 1024
    input_ops: [critic_1]
    output_ops: [critic_2]
  critic_2:
    model: "${MFE_MODEL_PATH}"
    prompt: "Run a final critique of the revised solution."
    max_tokens: 1024
    input_ops: [revise_1]
    output_ops: [final]
  final:
    model: "${MFE_MODEL_PATH}"
    prompt: "Return the final answer only."
    max_tokens: 1024
    input_ops: [critic_2]
    output_ops: []
