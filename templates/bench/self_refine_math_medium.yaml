start_ops: [draft]
end_ops: [final]
ops:
  draft:
    model: "${MFE_MODEL_PATH}"
    prompt: "Draft a complete mathematical solution with all important derivation steps."
    max_tokens: 1536
    input_ops: []
    output_ops: [critic]
  critic:
    model: "${MFE_MODEL_PATH}"
    prompt: "Critique the draft solution, focusing on invalid transformations, missing cases, and arithmetic errors."
    max_tokens: 1024
    input_ops: [draft]
    output_ops: [revise]
  revise:
    model: "${MFE_MODEL_PATH}"
    prompt: "Revise the solution using the critique and make the corrected derivation explicit."
    max_tokens: 1536
    input_ops: [critic]
    output_ops: [verify]
  verify:
    model: "${MFE_MODEL_PATH}"
    prompt: "Verify the revised solution against the original problem and extract the final result."
    max_tokens: 1024
    input_ops: [revise]
    output_ops: [final]
  final:
    model: "${MFE_MODEL_PATH}"
    prompt: "Return the final answer only."
    max_tokens: 256
    input_ops: [verify]
    output_ops: []
