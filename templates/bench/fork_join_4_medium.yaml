start_ops: [read]
end_ops: [final]
ops:
  read:
    model: "${MFE_MODEL_PATH}"
    prompt: "Read the input and identify four independent aspects to inspect."
    max_tokens: 1024
    input_ops: []
    output_ops: [branch_1, branch_2, branch_3, branch_4]
  branch_1:
    model: "${MFE_MODEL_PATH}"
    prompt: "Analyze aspect 1 and keep the result concise."
    max_tokens: 1024
    input_ops: [read]
    output_ops: [final]
  branch_2:
    model: "${MFE_MODEL_PATH}"
    prompt: "Analyze aspect 2 and keep the result concise."
    max_tokens: 1024
    input_ops: [read]
    output_ops: [final]
  branch_3:
    model: "${MFE_MODEL_PATH}"
    prompt: "Analyze aspect 3 and keep the result concise."
    max_tokens: 1024
    input_ops: [read]
    output_ops: [final]
  branch_4:
    model: "${MFE_MODEL_PATH}"
    prompt: "Analyze aspect 4 and keep the result concise."
    max_tokens: 1024
    input_ops: [read]
    output_ops: [final]
  final:
    model: "${MFE_MODEL_PATH}"
    prompt: "Synthesize all four aspects and return the final answer."
    max_tokens: 1024
    input_ops: [branch_1, branch_2, branch_3, branch_4]
    output_ops: []
