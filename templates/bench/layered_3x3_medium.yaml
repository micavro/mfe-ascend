start_ops: [root]
end_ops: [final]
ops:
  root:
    model: "${MFE_MODEL_PATH}"
    prompt: "Build a shared problem representation."
    max_tokens: 1024
    input_ops: []
    output_ops: [l1_a, l1_b, l1_c]
  l1_a:
    model: "${MFE_MODEL_PATH}"
    prompt: "Layer 1 analysis A."
    max_tokens: 1024
    input_ops: [root]
    output_ops: [l2_a, l2_b]
  l1_b:
    model: "${MFE_MODEL_PATH}"
    prompt: "Layer 1 analysis B."
    max_tokens: 1024
    input_ops: [root]
    output_ops: [l2_a, l2_c]
  l1_c:
    model: "${MFE_MODEL_PATH}"
    prompt: "Layer 1 analysis C."
    max_tokens: 1024
    input_ops: [root]
    output_ops: [l2_b, l2_c]
  l2_a:
    model: "${MFE_MODEL_PATH}"
    prompt: "Layer 2 merge A."
    max_tokens: 1024
    input_ops: [l1_a, l1_b]
    output_ops: [final]
  l2_b:
    model: "${MFE_MODEL_PATH}"
    prompt: "Layer 2 merge B."
    max_tokens: 1024
    input_ops: [l1_a, l1_c]
    output_ops: [final]
  l2_c:
    model: "${MFE_MODEL_PATH}"
    prompt: "Layer 2 merge C."
    max_tokens: 1024
    input_ops: [l1_b, l1_c]
    output_ops: [final]
  final:
    model: "${MFE_MODEL_PATH}"
    prompt: "Use the layer 2 results and return the final answer."
    max_tokens: 1024
    input_ops: [l2_a, l2_b, l2_c]
    output_ops: []
