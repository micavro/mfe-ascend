start_ops: [decompose]
end_ops: [final]
ops:
  decompose:
    model: "${MFE_MODEL_PATH}"
    prompt: "Decompose the question into two independent reasoning tracks."
    max_tokens: 1024
    input_ops: []
    output_ops: [track_a, track_b]
  track_a:
    model: "${MFE_MODEL_PATH}"
    prompt: "Answer the first reasoning track with concise evidence."
    max_tokens: 1024
    input_ops: [decompose]
    output_ops: [final]
  track_b:
    model: "${MFE_MODEL_PATH}"
    prompt: "Answer the second reasoning track with concise evidence."
    max_tokens: 1024
    input_ops: [decompose]
    output_ops: [final]
  final:
    model: "${MFE_MODEL_PATH}"
    prompt: "Merge both tracks and return the final answer."
    max_tokens: 1024
    input_ops: [track_a, track_b]
    output_ops: []
