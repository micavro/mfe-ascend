start_ops: [analyze]
end_ops: [final]
ops:
  analyze:
    model: "${MFE_MODEL_PATH}"
    prompt: "Analyze the programming task and identify requirements."
    max_tokens: 1024
    input_ops: []
    output_ops: [plan, tests]
  plan:
    model: "${MFE_MODEL_PATH}"
    prompt: "Create an implementation plan."
    max_tokens: 1024
    input_ops: [analyze]
    output_ops: [code]
  tests:
    model: "${MFE_MODEL_PATH}"
    prompt: "Extract or propose tests that the solution should satisfy."
    max_tokens: 1024
    input_ops: [analyze]
    output_ops: [review]
  code:
    model: "${MFE_MODEL_PATH}"
    prompt: "Write the Python code for the task."
    max_tokens: 1024
    input_ops: [plan]
    output_ops: [review]
  review:
    model: "${MFE_MODEL_PATH}"
    prompt: "Review the code against the tests and propose fixes if needed."
    max_tokens: 1024
    input_ops: [code, tests]
    output_ops: [final]
  final:
    model: "${MFE_MODEL_PATH}"
    prompt: "Return only the final Python code."
    max_tokens: 1024
    input_ops: [review]
    output_ops: []
