[project]
name = "mfe-ascend"
version = "0.1.0"
description = "MFE Ascend: multi-flow execution for LLM workflows on Huawei Ascend/openEuler"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate>=1.10.1",
    "agentscope==0.1.6",
    "datasets>=4.0.0",
    "langgraph==0.6.0",
    "matplotlib>=3.10.6",
    "numpy>=1.24.0",
    "pandas>=2.3.2",
    "pyyaml>=6.0",
    "torch==2.5.1",
    "torch-npu==2.5.1",
    "transformers==4.53.0",
    "vllm==0.9.0",
    "vllm-ascend==0.9.0rc2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mfe", "mfe.*"]
